<!DOCTYPE html>

<head>

    <!-- تحميل مكتبة Tailwind CSS -->

    <!-- تحميل خط Cairo العربي -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emeraldDz: '#006233',
                        coralDz: '#D21034',
                        sandBg: '#F8F9FA'
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #F8F9FA;
            color: #1F2937;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-up {
            animation: fadeSlideUp 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="bg-sandBg text-gray-800 antialiased pb-24 selection:bg-emeraldDz selection:text-white">

    <!-- الشريط العلوي مع خلفية بانورامية والشعار الرسمي ومبدل الأدوار -->
    <header class="relative overflow-hidden shadow-sm sticky top-0 z-40 max-w-md mx-auto border-b border-gray-100 bg-white">
        <img
            src="https://images.unsplash.com/photo-1589802829985-817e51171b92?auto=format&fit=crop&w=900&q=80"
            alt="بانوراما الجزائر"
            onerror="handleImgError(this, 'Rihla DZ', '#006233')"
            class="absolute inset-0 w-full h-full object-cover opacity-20 pointer-events-none"
        >
        <div class="absolute inset-0 bg-white/90 backdrop-blur-xs pointer-events-none"></div>

        <div class="relative px-4 pt-3 pb-2.5 space-y-2.5">
            <!-- الصف الأول: الهوية، الشعار، اللغة والإشعارات -->
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2.5 space-x-reverse">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-emeraldDz to-emerald-800 text-white flex flex-col items-center justify-center font-extrabold shadow-sm ring-2 ring-emeraldDz/20">
                        <span class="text-xs leading-none">DZ</span>
                        <span class="text-[8px] text-emerald-200 mt-0.5">RIHLA</span>
                    </div>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <h1 class="font-extrabold text-sm text-gray-900">Rihla DZ</h1>
                            <span class="text-[10px] bg-emeraldDz/10 text-emeraldDz font-bold px-2 py-0.5 rounded-full">هيفاء 👋</span>
                        </div>
                        <p class="text-[11px] text-emeraldDz font-bold" id="brand-slogan">خطّط، احجز، وسافر بثقة.</p>
                    </div>
                </div>

                <div class="flex items-center space-x-1.5 space-x-reverse">
                    <button
                        type="button"
                        onclick="toggleLang()"
                        id="lang-btn"
                        class="px-2.5 py-1.5 text-xs font-bold bg-white border border-gray-200 rounded-xl hover:bg-gray-100 transition shadow-2xs active:scale-95"

                    <button

                        <span>🔔</span>
                        <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-coralDz rounded-full"></span>
                    </button>
                </div>

            <!-- الصف الثاني: مبدّل الأدوار (زائر / شريك / إدارة) -->
            <div class="bg-gray-100/90 p-1 rounded-xl grid grid-cols-3 gap-1 text-[11px] font-bold">

        </div>
    </header>

    <!-- المحتوى الرئيسي للتطبيق -->

                <div class="relative flex justify-between items-center">

                    </div>
                    <span class="text-[10px] bg-coralDz px-2.5 py-1 rounded-full font-bold shadow-2xs" id="planner-badge">MVP: سطيف • قسنطينة • بجاية</span>
                </div>

                <div class="relative space-y-3">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        <div>
                            <label for="dest-select" class="block text-xs text-emerald-100 mb-1" id="label-dest">الوجهة السياحية:</label>
                            <select id="dest-select" class="w-full bg-white/15 border border-white/25 rounded-xl px-3 py-2.5 text-white text-xs focus:outline-none focus:ring-2 focus:ring-white/40">
                                <optgroup label="🚀 مدن الانطلاق الأساسية (MVP)" class="text-gray-900 font-bold">
                                    <option value="سطيف وجميلة" class="text-gray-800">سطيف وجميلة (الآثار الرومانية والهضاب)</option>
                                    <option value="قسنطينة" class="text-gray-800">قسنطينة (مدينة الجسور المعلقة)</option>
                                    <option value="بجاية وجيجل" class="text-gray-800">بجاية (الساحل، قورايا، والقبائل)</option>
                                </optgroup>
                                <optgroup label="🏔️ الشمال والقبائل" class="text-gray-900 font-bold">

                                </optgroup>
                                <optgroup label="🏛️ الشرق الجزائري" class="text-gray-900 font-bold">

                                    <option value="تمنراست والهقار" class="text-gray-800">تمنراست والهقار (أسكرام والتاسيلي)</option>
                                </optgroup>
                            </select>
                        </div>

                        <div>
                            <label for="interest-select" class="block text-xs text-emerald-100 mb-1" id="label-interest">نمط الرحلة والاهتمام:</label>
                            <select id="interest-select" class="w-full bg-white/15 border border-white/25 rounded-xl px-3 py-2.5 text-white text-xs focus:outline-none focus:ring-2 focus:ring-white/40">
                                <option value="عطلة نهاية أسبوع منظمة" class="text-gray-800">🗓️ عطلة نهاية أسبوع منظمة</option>

                                <option value="رحلة طلابية / شركات B2B" class="text-gray-800">🎓 رحلة طلابية / شركات B2B</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label for="duration-select" class="block text-xs text-emerald-100 mb-1" id="label-duration">مدة الرحلة</label>

            <section>

                    </button>

                    >

                            src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=150&q=80"
                            alt="الجبال"
                            onerror="handleImgError(this, 'الجبال', '#0d9488')"
                            class="w-10 h-10 rounded-full object-cover mb-1.5 ring-2 ring-teal-200"
                        >
                        <span class="text-[11px] font-bold">الجبال</span>
                    </button>

                    <button
                        type="button"
                        onclick="filterRegion('التراث', this)"
                        class="filter-btn flex flex-col items-center flex-shrink-0 bg-white text-gray-800 p-2.5 rounded-2xl shadow-sm border border-gray-100 w-20 transition active:scale-95"
                    >

                            alt="التراث"
                            onerror="handleImgError(this, 'التراث', '#7c2d12')"
                            class="w-10 h-10 rounded-full object-cover mb-1.5 ring-2 ring-emerald-200"
